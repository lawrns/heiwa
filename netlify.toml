[build]
  command = "npm run build"
  # Publish directory is handled by @netlify/plugin-nextjs
  # Enable incremental builds for faster deployments

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  BUILD_ID = "2025-11-09-23-53-final-fixes"
  NODE_VERSION = "18"
  # Optimize build performance
  NPM_FLAGS = "--prefer-offline --no-audit"
  # Enable caching for faster builds
  NETLIFY_USE_YARN = "true"
  YARN_CACHE_FOLDER = ".yarn/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static assets for better performance
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

# No caching for API routes during development
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Redirect rules for better UX
[[redirects]]
  from = "/admin"
  to = "/admin/login"
  status = 302
  force = false

# Catch-all redirect for Next.js routing (handled by plugin, but kept for safety)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200

